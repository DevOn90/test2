name: ci-npm-audit

on:
  workflow_call

jobs:
    npm-audit:
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: apps/front-end

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 ## Ref v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 ## Ref v7.0.0
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: 'apps/front-end/package-lock.json'

            - name: Install dependencies
              run: npm ci

            - name: Run npm audit
              run: npm audit --audit-level=high
