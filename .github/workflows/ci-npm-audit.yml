name: ci-npm-audit

on:
  workflow_call

jobs:
    npm-audit:
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: apps/front-end

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 ## Ref v4

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 ## Ref v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: 'apps/front-end/package-lock.json'

            - name: Install dependencies
              run: npm ci

            - name: Run npm audit
              run: npm audit --audit-level=high
